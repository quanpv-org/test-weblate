name: "SonarQube Analysis"

# This workflow performs automated code quality and security scanning using SonarQube
# 
# Required GitHub Secrets:
#   SONAR_TOKEN: Authentication token for SonarQube (generate from SonarQube account)
#   SONAR_HOST_URL: URL of your SonarQube server (e.g., https://sonarcloud.io)
#
# Features:
#   - Code quality analysis
#   - Security vulnerability detection
#   - Code coverage reporting
#   - Duplicate code detection
#   - Quality gate enforcement

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for better blame information
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*test*/**,**/*.test.*,**/vendor/**,**/node_modules/**,**/.git/**
            -Dsonar.scm.provider=git
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
